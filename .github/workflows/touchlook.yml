name: Build PPSSPP with touch look
on:
  workflow_dispatch:
    inputs:
      ppsspp_ref:
        description: 'PPSSPP version to build (tag or branch)'
        default: 'v1.20.4'
      look_buttons:
        description: 'Custom buttons that fire AND look when you hold and slide: all, none, or numbers like 1,3'
        default: 'all'
      aim_gain:
        description: 'Aim sensitivity for those games (stick units per swipe step; higher is faster)'
        default: '6'
      aim_deadzone:
        description: 'Skips the game dead zone so slow swipes register (raise if slow swipes do nothing, lower if aim drifts)'
        default: '20'
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: hrydgard/ppsspp
          ref: ${{ github.event.inputs.ppsspp_ref }}
          submodules: recursive
          fetch-depth: 0
      - name: Reuse the same signing key every build (so updates install over the top)
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: debug-keystore-v1
      - name: Apply touch look patch
        env:
          LOOK_BUTTONS: ${{ github.event.inputs.look_buttons }}
          AIM_GAIN: ${{ github.event.inputs.aim_gain }}
          AIM_DEADZONE: ${{ github.event.inputs.aim_deadzone }}
        run: |
          python3 - <<'PY'
          import os, re, sys, pathlib

          def edit(path, steps):
              p = pathlib.Path(path)
              if not p.exists():
                  sys.exit('PATCH FAILED: missing file ' + path)
              s = p.read_text(encoding='utf-8')
              for name, pattern, repl in steps:
                  s, n = re.subn(pattern, repl, s, count=1)
                  if n != 1:
                      sys.exit('PATCH FAILED: could not find "' + name + '" in ' + path)
              p.write_text(s, encoding='utf-8')

          # Which custom buttons get "hold and slide to look": all, none, or a list like 1,3
          look = os.environ.get('LOOK_BUTTONS', 'all').strip().lower()
          mask = 0
          if look in ('', 'all'):
              mask = (1 << 64) - 1
          elif look != 'none':
              for part in look.split(','):
                  part = part.strip()
                  if part.isdigit() and 1 <= int(part) <= 64:
                      mask |= 1 << (int(part) - 1)
          print('Look-enabled custom button mask: ' + hex(mask))

          AIM_CPP = '''
          // ---- Touch aim: a swipe goes straight into the LEFT stick data the game reads ----
          // Used while the right-side gesture zone has "analog stick gesture" switched on. No on-screen stick
          // emulation: all movement between game reads is added up, a dead zone offset makes slow swipes
          // register, and any overflow is carried into the next read.
          static float touchAimX = 0.0f;
          static float touchAimY = 0.0f;
          static float aimCarryX = 0.0f;
          static float aimCarryY = 0.0f;
          static std::chrono::steady_clock::time_point lastAimEvent;

          void __CtrlAddTouchAim(float dx, float dy) {
          	std::lock_guard<std::mutex> guard(ctrlMutex);
          	touchAimX += dx;
          	touchAimY += dy;
          	lastAimEvent = std::chrono::steady_clock::now();
          }

          static int TouchAimShape(float v, float &carry) {
          	const float deadzone = @DZ@f;
          	float m = v < 0.0f ? -v : v;
          	if (m < 0.5f) {
          		carry = 0.0f;
          		return 0;
          	}
          	float room = 127.0f - deadzone;
          	float used = m < room ? m : room;
          	float rest = m - used;
          	if (rest > 150.0f)
          		rest = 150.0f;
          	carry = v < 0.0f ? -rest : rest;
          	int out = (int)lroundf(deadzone + used);
          	return v < 0.0f ? -out : out;
          }

          template <class P>
          static void TouchAimApply(P &pad, float ax, float ay) {
          	bool recent = (std::chrono::steady_clock::now() - lastAimEvent) < std::chrono::milliseconds(120);
          	int sx = TouchAimShape(ax * @AIMGAIN@f + aimCarryX, aimCarryX);
          	int sy = TouchAimShape(ay * @AIMGAIN@f + aimCarryY, aimCarryY);
          	if (!recent && sx == 0 && sy == 0)
          		return;
          	u8 *raw = (u8 *)&pad->buttons - 4;
          	raw[8] = (u8)std::max(1, std::min(255, 128 + sx));
          	raw[9] = (u8)std::max(1, std::min(255, 128 + sy));
          }
          '''

          aim_gain = repr(float(os.environ.get('AIM_GAIN', '6').strip() or '6'))
          aim_deadzone = repr(float(os.environ.get('AIM_DEADZONE', '20').strip() or '20'))
          aim_code = AIM_CPP.replace('@DZ@', aim_deadzone).replace('@AIMGAIN@', aim_gain)


          def find_analog_field():
              # Find the name of the "analog stick gesture" switch of a gesture zone.
              gp = pathlib.Path('UI/GamepadEmu.cpp')
              text = gp.read_text(encoding='utf-8', errors='ignore') if gp.exists() else ''
              for pattern in (r'GetZone\(\)\s*\.\s*(b\w*Analog\w*)', r'\bzone\s*\.\s*(b\w*Analog\w*)',
                              r'gestureControls\[[^\]]*\]\s*\.\s*(b\w*Analog\w*)'):
                  m = re.search(pattern, text)
                  if m:
                      return m.group(1)
              for path in list(pathlib.Path('Core').rglob('*.h')) + list(pathlib.Path('UI').rglob('*.h')) + list(pathlib.Path('Common').rglob('*.h')):
                  try:
                      t = path.read_text(encoding='utf-8', errors='ignore')
                  except Exception:
                      continue
                  m = re.search(r'struct\s+GestureControlConfig\s*\{(.*?)\n\s*\};', t, re.S)
                  if m:
                      f = re.search(r'bool\s+(\w*[Aa]nalog\w*)\s*[;=\{]', m.group(1))
                      if f:
                          return f.group(1)
              for n, line in enumerate(text.splitlines(), 1):
                  if 'nalog' in line:
                      print('GamepadEmu.cpp:%d: %s' % (n, line.strip()))
              sys.exit('PATCH FAILED: could not find the analog gesture switch')

          analog_field = find_analog_field()
          print('Right-zone analog gesture switch: ' + analog_field)

          edit('Core/HLE/sceCtrl.cpp', [
            ('include', r'(#include <cmath>[^\n]*\n)',
             lambda m: m.group(1) + '#include <algorithm>\n#include <chrono>\n'),
            ('mutex', r'(static std::mutex ctrlMutex;[^\n]*\n)',
             lambda m: m.group(1) + '''
          // Touch look: finger movement collected since the game last read the pad.
          static float touchLookX = 0.0f;
          static float touchLookY = 0.0f;

          void __CtrlAddTouchLook(float dx, float dy) {
          	std::lock_guard<std::mutex> guard(ctrlMutex);
          	touchLookX += dx;
          	touchLookY += dy;
          }
          ''' + aim_code),
            ('read', r'(\*data = ctrlBufs\[ctrlBufRead\];[^\n]*\n)',
             lambda m: m.group(1) + '''
          		{
          			std::lock_guard<std::mutex> guard(ctrlMutex);
          			int tx = (int)lroundf(std::max(-2000.0f, std::min(2000.0f, touchLookX)) * 16.0f);
          			int ty = (int)lroundf(std::max(-2000.0f, std::min(2000.0f, touchLookY)) * 16.0f);
          			touchLookX = 0.0f;
          			touchLookY = 0.0f;
          			data->unused[0] = (u8)(tx & 0xFF);
          			data->unused[1] = (u8)((tx >> 8) & 0xFF);
          			data->unused[2] = (u8)(ty & 0xFF);
          			data->unused[3] = (u8)((ty >> 8) & 0xFF);
          			float aimX = touchAimX;
          			float aimY = touchAimY;
          			touchAimX = 0.0f;
          			touchAimY = 0.0f;
          			TouchAimApply(data, aimX, aimY);
          		}
          '''),
          ])

          _gp = pathlib.Path('UI/GamepadEmu.cpp')
          new_flags = _gp.exists() and ('TouchInputFlags::' in _gp.read_text(encoding='utf-8'))
          print('Touch flag style: ' + ('TouchInputFlags::X' if new_flags else 'TOUCH_X'))

          def fl(t):
              for n in ('DOWN', 'MOVE', 'UP', 'RELEASE_ALL'):
                  t = t.replace('@' + n + '@', ('TouchInputFlags::' if new_flags else 'TOUCH_') + n)
              return t

          edit('UI/GamepadEmu.cpp', [
            ('include map', r'(#include <algorithm>[^\n]*\n)',
             lambda m: m.group(1) + '#include <cstdlib>\n#include <map>\n#include <string>\n'),
            ('include', r'(#include "UI/GamepadEmu.h"[^\n]*\n)',
             lambda m: m.group(1) + '\nvoid __CtrlAddTouchLook(float dx, float dy);\nvoid __CtrlAddTouchAim(float dx, float dy);\n'),
            ('statics', r'(static uint32_t analogPointerMask = 0;[^\n]*\n)',
             lambda m: m.group(1) + '''
          // Touch look on custom buttons: hold one and slide to turn the camera.
          struct TouchLookState {
          	int pointer = -1;
          	float lastX = 0.0f;
          	float lastY = 0.0f;
          };
          static std::map<const void *, TouchLookState> g_touchLook;
          // True while the right-side gesture zone has its analog stick gesture switched on.
          static bool g_touchAimRightZone = false;
          static const unsigned long long g_touchLookMask = @MASK@ULL;

          // The custom button number is read from its label, for example "Custom 3 button".
          static bool TouchLookEnabled(const UI::View *button) {
          	if (g_touchLookMask == ~0ULL)
          		return true;
          	std::string text = button->DescribeText();
          	int number = 0;
          	for (size_t i = 0; i < text.size(); i++) {
          		if (text[i] >= '0' && text[i] <= '9') {
          			number = atoi(text.c_str() + i);
          			break;
          		}
          	}
          	if (number == 0)
          		return true;  // label has no number: cannot tell which button this is
          	return number >= 1 && number <= 64 && ((g_touchLookMask >> (number - 1)) & 1ULL) != 0;
          }
          '''.replace('@MASK@', hex(mask))),
            ('custom touch', r'(bool CustomButton::Touch\(const TouchInput &input\) \{\s*using namespace CustomKeyData;\s*bool lastDown = pointerDownMask_ != 0;\s*bool retval = MultiTouchButton::Touch\(input\);)',
             lambda m: m.group(1) + fl('''

          	if (g_touchLookMask != 0 && TouchLookEnabled(this)) {
          		TouchLookState &look = g_touchLook[this];
          		if ((input.flags & @DOWN@) && (pointerDownMask_ & (1 << input.id))) {
          			look.pointer = input.id;
          			look.lastX = input.x;
          			look.lastY = input.y;
          		} else if ((input.flags & @MOVE@) && input.id == look.pointer && lastDown) {
          			// Stay pressed while the finger slides off the button, and turn the camera.
          			pointerDownMask_ |= 1 << input.id;
          			if (g_touchAimRightZone)
          				__CtrlAddTouchAim((input.x - look.lastX) * g_display.dpi_scale_x, (input.y - look.lastY) * g_display.dpi_scale_y);
          			else
          				__CtrlAddTouchLook((input.x - look.lastX) * g_display.dpi_scale_x, (input.y - look.lastY) * g_display.dpi_scale_y);
          			look.lastX = input.x;
          			look.lastY = input.y;
          		}
          		if ((input.flags & @UP@) && input.id == look.pointer)
          			look.pointer = -1;
          		if (input.flags & @RELEASE_ALL@)
          			look.pointer = -1;
          	}
          ''')),
            ('drag', r'(deltaX_ \+= input\.x - lastX_;\s*deltaY_ \+= input\.y - lastY_;)(\s*lastX_ = input\.x;)',
             lambda m: m.group(1) + '\n\t\t\tif (zoneIndex_ == 1 && g_touchAimRightZone)\n\t\t\t\t__CtrlAddTouchAim((input.x - lastX_) * g_display.dpi_scale_x, (input.y - lastY_) * g_display.dpi_scale_y);\n\t\t\telse\n\t\t\t\t__CtrlAddTouchLook((input.x - lastX_) * g_display.dpi_scale_x, (input.y - lastY_) * g_display.dpi_scale_y);' + m.group(2)),
            ('update', r'(void GestureGamepad::Update\(\)\s*\{)',
             lambda m: m.group(1) + '\n\tif (zoneIndex_ == 1)\n\t\tg_touchAimRightZone = GetZone().' + analog_field + ';'),
          ])
          # Optional: forget the switch when the right zone goes away (not essential if it cannot be found).
          _gp = pathlib.Path('UI/GamepadEmu.cpp')
          _txt = _gp.read_text(encoding='utf-8')
          _txt, _n = re.subn(r'(GestureGamepad::~GestureGamepad\(\)\s*\{)',
                             lambda m: m.group(1) + '\n\tif (zoneIndex_ == 1)\n\t\tg_touchAimRightZone = false;', _txt, count=1)
          if _n == 1:
              _gp.write_text(_txt, encoding='utf-8')
          else:
              print('Note: right-zone cleanup step not found (harmless).')
          print('Patch applied.')
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - name: Build APK (arm64 only, to save time)
        run: |
          set -o pipefail
          {
            if [ -f gradlew ]; then
              bash ./gradlew assembleNormalOptimized -Pandroid.injected.build.abi=arm64-v8a --stacktrace
            else
              cd android && bash ./gradlew assembleNormalOptimized -Pandroid.injected.build.abi=arm64-v8a --stacktrace
            fi
          } 2>&1 | tee "$GITHUB_WORKSPACE/build.log"
      - name: Show the important error lines
        if: failure()
        run: |
          echo "=== lines containing errors ==="
          grep -n -E "error:|fatal error|undefined reference|PATCH FAILED|No space left|Killed" build.log | head -40 || true
          echo "=== context around the first error ==="
          grep -n -m1 -B4 -A20 "error:" build.log | cut -c1-300 || true
      - name: Save the full log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
      - name: Collect APK
        run: |
          mkdir out
          find . -name '*.apk' -path '*optimized*' -exec cp {} out/ \;
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: ppsspp-touch-look
          path: out/
