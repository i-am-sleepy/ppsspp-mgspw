name: Build PPSSPP with touch look
on:
  workflow_dispatch:
    inputs:
      ppsspp_ref:
        description: 'PPSSPP version to build (tag or branch)'
        default: 'v1.20.4'
      look_buttons:
        description: 'Custom buttons that fire AND look when you hold and slide: all, none, or numbers like 1,3'
        default: 'all'
      native_look_sensitivity:
        description: 'Native touch look (right gesture zone + analog gesture only): sensitivity, 1.0 = default'
        default: '1.0'
      native_look_invert_y:
        description: 'Native touch look: invert vertical look (true or false)'
        default: 'false'
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: hrydgard/ppsspp
          ref: ${{ github.event.inputs.ppsspp_ref }}
          submodules: recursive
          fetch-depth: 0
      - name: Reuse the same signing key every build (so updates install over the top)
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: debug-keystore-v1
      - name: Apply touch look patch
        env:
          LOOK_BUTTONS: ${{ github.event.inputs.look_buttons }}
        run: |
          python3 - <<'PY'
          import os, re, sys, pathlib

          def edit(path, steps):
              p = pathlib.Path(path)
              if not p.exists():
                  sys.exit('PATCH FAILED: missing file ' + path)
              s = p.read_text(encoding='utf-8')
              for name, pattern, repl in steps:
                  s, n = re.subn(pattern, repl, s, count=1)
                  if n != 1:
                      sys.exit('PATCH FAILED: could not find "' + name + '" in ' + path)
              p.write_text(s, encoding='utf-8')

          # Which custom buttons get "hold and slide to look": all, none, or a list like 1,3
          look = os.environ.get('LOOK_BUTTONS', 'all').strip().lower()
          mask = 0
          if look in ('', 'all'):
              mask = (1 << 64) - 1
          elif look != 'none':
              for part in look.split(','):
                  part = part.strip()
                  if part.isdigit() and 1 <= int(part) <= 64:
                      mask |= 1 << (int(part) - 1)
          print('Look-enabled custom button mask: ' + hex(mask))

          edit('Core/HLE/sceCtrl.cpp', [
            ('include', r'(#include <cmath>[^\n]*\n)',
             lambda m: m.group(1) + '#include <algorithm>\n'),
            ('mutex', r'(static std::mutex ctrlMutex;[^\n]*\n)',
             lambda m: m.group(1) + '''
          // Touch look: finger movement collected since the game last read the pad.
          static float touchLookX = 0.0f;
          static float touchLookY = 0.0f;

          void __CtrlAddTouchLook(float dx, float dy) {
          	std::lock_guard<std::mutex> guard(ctrlMutex);
          	touchLookX += dx;
          	touchLookY += dy;
          }
          '''),
            ('read', r'(\*data = ctrlBufs\[ctrlBufRead\];[^\n]*\n)',
             lambda m: m.group(1) + '''
          		{
          			std::lock_guard<std::mutex> guard(ctrlMutex);
          			int tx = (int)lroundf(std::max(-2000.0f, std::min(2000.0f, touchLookX)) * 16.0f);
          			int ty = (int)lroundf(std::max(-2000.0f, std::min(2000.0f, touchLookY)) * 16.0f);
          			touchLookX = 0.0f;
          			touchLookY = 0.0f;
          			data->unused[0] = (u8)(tx & 0xFF);
          			data->unused[1] = (u8)((tx >> 8) & 0xFF);
          			data->unused[2] = (u8)(ty & 0xFF);
          			data->unused[3] = (u8)((ty >> 8) & 0xFF);
          		}
          '''),
          ])

          _gp = pathlib.Path('UI/GamepadEmu.cpp')
          new_flags = _gp.exists() and ('TouchInputFlags::' in _gp.read_text(encoding='utf-8'))
          print('Touch flag style: ' + ('TouchInputFlags::X' if new_flags else 'TOUCH_X'))

          def fl(t):
              for n in ('DOWN', 'MOVE', 'UP', 'RELEASE_ALL'):
                  t = t.replace('@' + n + '@', ('TouchInputFlags::' if new_flags else 'TOUCH_') + n)
              return t

          edit('UI/GamepadEmu.cpp', [
            ('include map', r'(#include <algorithm>[^\n]*\n)',
             lambda m: m.group(1) + '#include <cstdlib>\n#include <map>\n#include <string>\n'),
            ('include', r'(#include "UI/GamepadEmu.h"[^\n]*\n)',
             lambda m: m.group(1) + '\nvoid __CtrlAddTouchLook(float dx, float dy);\n'),
            ('statics', r'(static uint32_t analogPointerMask = 0;[^\n]*\n)',
             lambda m: m.group(1) + '''
          // Touch look on custom buttons: hold one and slide to turn the camera.
          struct TouchLookState {
          	int pointer = -1;
          	float lastX = 0.0f;
          	float lastY = 0.0f;
          };
          static std::map<const void *, TouchLookState> g_touchLook;
          static const unsigned long long g_touchLookMask = @MASK@ULL;

          // The custom button number is read from its label, for example "Custom 3 button".
          static bool TouchLookEnabled(const UI::View *button) {
          	if (g_touchLookMask == ~0ULL)
          		return true;
          	std::string text = button->DescribeText();
          	int number = 0;
          	for (size_t i = 0; i < text.size(); i++) {
          		if (text[i] >= '0' && text[i] <= '9') {
          			number = atoi(text.c_str() + i);
          			break;
          		}
          	}
          	if (number == 0)
          		return true;  // label has no number: cannot tell which button this is
          	return number >= 1 && number <= 64 && ((g_touchLookMask >> (number - 1)) & 1ULL) != 0;
          }
          '''.replace('@MASK@', hex(mask))),
            ('custom touch', r'(bool CustomButton::Touch\(const TouchInput &input\) \{\s*using namespace CustomKeyData;\s*bool lastDown = pointerDownMask_ != 0;\s*bool retval = MultiTouchButton::Touch\(input\);)',
             lambda m: m.group(1) + fl('''

          	if (g_touchLookMask != 0 && TouchLookEnabled(this)) {
          		TouchLookState &look = g_touchLook[this];
          		if ((input.flags & @DOWN@) && (pointerDownMask_ & (1 << input.id))) {
          			look.pointer = input.id;
          			look.lastX = input.x;
          			look.lastY = input.y;
          		} else if ((input.flags & @MOVE@) && input.id == look.pointer && lastDown) {
          			// Stay pressed while the finger slides off the button, and turn the camera.
          			pointerDownMask_ |= 1 << input.id;
          			__CtrlAddTouchLook((input.x - look.lastX) * g_display.dpi_scale_x, (input.y - look.lastY) * g_display.dpi_scale_y);
          			look.lastX = input.x;
          			look.lastY = input.y;
          		}
          		if ((input.flags & @UP@) && input.id == look.pointer)
          			look.pointer = -1;
          		if (input.flags & @RELEASE_ALL@)
          			look.pointer = -1;
          	}
          ''')),
            ('drag', r'(deltaX_ \+= input\.x - lastX_;\s*deltaY_ \+= input\.y - lastY_;)(\s*lastX_ = input\.x;)',
             lambda m: m.group(1) + '\n\t\t\t__CtrlAddTouchLook((input.x - lastX_) * g_display.dpi_scale_x, (input.y - lastY_) * g_display.dpi_scale_y);' + m.group(2)),
          ])
          print('Patch applied.')
          PY
      - name: Apply native touch look patch (right gesture zone analog only)
        env:
          NL_SENS: ${{ github.event.inputs.native_look_sensitivity }}
          NL_INVERT_Y: ${{ github.event.inputs.native_look_invert_y }}
        run: |
          python3 - <<'NLPY'
          import os, re, sys, pathlib

          def edit(path, steps):
              p = pathlib.Path(path)
              if not p.exists():
                  sys.exit('PATCH FAILED: missing file ' + path)
              s = p.read_text(encoding='utf-8')
              for name, pattern, repl in steps:
                  s, n = re.subn(pattern, repl, s, count=1)
                  if n != 1:
                      sys.exit('PATCH FAILED: could not find "' + name + '" in ' + path)
              p.write_text(s, encoding='utf-8')

          def num(env, default, lo, hi):
              try:
                  v = float(os.environ.get(env, default))
              except ValueError:
                  v = float(default)
              return max(lo, min(hi, v))

          sens = num('NL_SENS', '1.0', 0.05, 10.0)
          invert = os.environ.get('NL_INVERT_Y', 'false').strip().lower() in ('1', 'true', 'yes')
          print('Native look: sensitivity ' + str(sens) + ', invert Y ' + str(invert))

          # Stops the stock analog-gesture code from writing the left stick, but ONLY while the
          # right-zone native look is active. Everywhere else this flag stays false, so nothing changes.
          edit('Core/HLE/sceCtrl.cpp', [
            ('analog xy', r'(void __CtrlSetAnalogXY\(int stick, float x, float y\)\s*\{)',
             lambda m: 'static thread_local bool g_nativeLookSuppressLeft = false;\n'
                       'void __CtrlSuppressLeftStick(bool suppress) {\n\tg_nativeLookSuppressLeft = suppress;\n}\n\n'
                       + m.group(1) + '\n\tif (stick == 0 && g_nativeLookSuppressLeft)\n\t\treturn;'),
          ])

          _gp = pathlib.Path('UI/GamepadEmu.cpp')
          if not _gp.exists():
              sys.exit('PATCH FAILED: missing file UI/GamepadEmu.cpp')
          _t = _gp.read_text(encoding='utf-8')
          new_flags = 'TouchInputFlags::' in _t
          print('Touch flag style: ' + ('TouchInputFlags::X' if new_flags else 'TOUCH_X'))

          def fl(t):
              for n in ('DOWN', 'MOVE', 'UP', 'RELEASE_ALL'):
                  t = t.replace('@' + n + '@', ('TouchInputFlags::' if new_flags else 'TOUCH_') + n)
              return t

          NL_BLOCK = fl('''
          // ---- Native touch look: right gesture zone + "analog gesture" enabled ----
          // Finger speed (not distance from where you touched down) drives the left analog stick.
          // Does nothing unless GestureGamepad zone 1 has the analog gesture option turned on.
          void __CtrlSuppressLeftStick(bool suppress);

          namespace {
          struct NativeLookState {
          	int pointer = -1;
          	float lastX = 0.0f;
          	float lastY = 0.0f;
          	float accX = 0.0f;   // finger movement in pixels since the last frame
          	float accY = 0.0f;
          	float outX = 0.0f;   // smoothed stick value
          	float outY = 0.0f;
          	bool active = false; // we have written a stick value that must be cleared later
          };
          NativeLookState g_nl;
          const float NL_SENS = @SENS@f;
          const float NL_INVERT_Y = @INVY@f;
          const float NL_PIXELS_FOR_FULL = 40.0f;  // pixels per frame that equal full stick
          const float NL_SMOOTH = 0.45f;           // 0 = raw, closer to 1 = smoother
          const float NL_INV_DEADZONE = 0.13f;     // lifts small movements past the game's own deadzone

          float NativeLookShape(float v) {
          	float a = fabsf(v);
          	if (a < 0.02f)
          		return 0.0f;
          	a = NL_INV_DEADZONE + (1.0f - NL_INV_DEADZONE) * std::min(1.0f, a);
          	return v < 0.0f ? -a : a;
          }

          void NativeLookRelease() {
          	g_nl.pointer = -1;
          	g_nl.accX = g_nl.accY = 0.0f;
          	g_nl.outX = g_nl.outY = 0.0f;
          	if (g_nl.active) {
          		__CtrlSetAnalogXY(0, 0.0f, 0.0f);
          		g_nl.active = false;
          	}
          }

          void NativeLookTouch(const TouchInput &input, const Bounds &zone) {
          	if (input.flags & @RELEASE_ALL@) {
          		NativeLookRelease();
          		return;
          	}
          	if (input.flags & @DOWN@) {
          		if (g_nl.pointer == -1 && !(usedPointerMask & (1 << input.id)) &&
          			zone.Contains(input.x, input.y) && input.x >= g_display.dp_xres * 0.5f) {
          			g_nl.pointer = input.id;
          			g_nl.lastX = input.x;
          			g_nl.lastY = input.y;
          			g_nl.accX = g_nl.accY = 0.0f;
          		}
          		return;
          	}
          	if (input.id != g_nl.pointer)
          		return;
          	if (usedPointerMask & (1 << input.id)) {
          		NativeLookRelease();  // an on-screen button took this finger
          		return;
          	}
          	if (input.flags & @MOVE@) {
          		g_nl.accX += (input.x - g_nl.lastX) * g_display.dpi_scale_x;
          		g_nl.accY += (input.y - g_nl.lastY) * g_display.dpi_scale_y;
          		g_nl.lastX = input.x;
          		g_nl.lastY = input.y;
          	}
          	if (input.flags & @UP@)
          		NativeLookRelease();
          }

          void NativeLookFrame() {
          	if (g_nl.pointer == -1)
          		return;
          	float tx = std::max(-1.0f, std::min(1.0f, g_nl.accX / NL_PIXELS_FOR_FULL * NL_SENS));
          	float ty = std::max(-1.0f, std::min(1.0f, -g_nl.accY / NL_PIXELS_FOR_FULL * NL_SENS * NL_INVERT_Y));
          	g_nl.accX = 0.0f;
          	g_nl.accY = 0.0f;
          	g_nl.outX = g_nl.outX * NL_SMOOTH + tx * (1.0f - NL_SMOOTH);
          	g_nl.outY = g_nl.outY * NL_SMOOTH + ty * (1.0f - NL_SMOOTH);
          	__CtrlSetAnalogXY(0, NativeLookShape(g_nl.outX), NativeLookShape(g_nl.outY));
          	g_nl.active = true;
          }
          }  // namespace
          ''').replace('@SENS@', repr(sens)).replace('@INVY@', '-1.0' if invert else '1.0')

          TOUCH_HOOK = '''
          	// Native touch look (right zone + analog gesture only). Stock behaviour is untouched otherwise.
          	const bool nativeLookOn = (zoneIndex_ == 1 && GetZone().bAnalogGesture);
          	if (nativeLookOn)
          		NativeLookTouch(input, bounds_);
          	else if (g_nl.pointer != -1)
          		NativeLookRelease();
          	struct NativeLookStockGuard {
          		bool on;
          		explicit NativeLookStockGuard(bool o) : on(o) { if (on) __CtrlSuppressLeftStick(true); }
          		~NativeLookStockGuard() { if (on) __CtrlSuppressLeftStick(false); }
          	} nativeLookStockGuard(nativeLookOn);
          '''

          edit('UI/GamepadEmu.cpp', [
            ('include cmath', r'(#include <algorithm>[^\n]*\n)', lambda m: m.group(1) + '#include <cmath>\n'),
            ('pointer masks', r'(static uint32_t analogPointerMask = 0;[^\n]*\n)', lambda m: m.group(1) + NL_BLOCK),
            ('gesture touch', r'(bool GestureGamepad::Touch\(const TouchInput &input\)\s*\{)', lambda m: m.group(1) + TOUCH_HOOK),
            ('gesture update', r'(void GestureGamepad::Update\(\)\s*\{)', lambda m: m.group(1) + '\n\tNativeLookFrame();'),
          ])
          print('Native look patch applied.')
          NLPY
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - name: Build APK (arm64 only, to save time)
        run: |
          set -o pipefail
          {
            if [ -f gradlew ]; then
              bash ./gradlew assembleNormalOptimized -Pandroid.injected.build.abi=arm64-v8a --stacktrace
            else
              cd android && bash ./gradlew assembleNormalOptimized -Pandroid.injected.build.abi=arm64-v8a --stacktrace
            fi
          } 2>&1 | tee "$GITHUB_WORKSPACE/build.log"
      - name: Show the important error lines
        if: failure()
        run: |
          echo "=== lines containing errors ==="
          grep -n -E "error:|fatal error|undefined reference|PATCH FAILED|No space left|Killed" build.log | head -40 || true
          echo "=== context around the first error ==="
          grep -n -m1 -B4 -A20 "error:" build.log | cut -c1-300 || true
      - name: Save the full log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
      - name: Collect APK
        run: |
          mkdir out
          find . -name '*.apk' -path '*optimized*' -exec cp {} out/ \;
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: ppsspp-touch-look
          path: out/
